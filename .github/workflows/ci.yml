name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Unit tests + UI tests against the local mock mailbox in headless Chrome
      # (Chrome is preinstalled on GitHub-hosted runners; Selenium Manager fetches the driver)
      - name: Run tests
        run: ./mvnw -B verify

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-java-${{ matrix.java }}
          path: target/extent-report/
