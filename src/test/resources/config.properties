# Any key below can be overridden with -Dkey=value or an environment variable
# (upper-case, dots -> underscores), e.g. -Dtarget=gmail or MAIL_USERNAME=me@gmail.com

#Application under test
#  mock  = local HTML replica of the Gmail flows (default, runs offline and in CI)
#  gmail = the real https://mail.google.com (needs MAIL_USERNAME / MAIL_PASSWORD)
target = mock

#Browser: chrome, firefox or edge. Drivers are resolved automatically by Selenium Manager.
browser = chrome
headless = true
timeout_seconds = 15
page_load_timeout_seconds = 60

#URLs
mock.base_url = classpath:mock/mailbox.html
mock.logout_url = classpath:mock/mailbox.html?logout
gmail.base_url = https://mail.google.com/
gmail.logout_url = https://accounts.google.com/Logout

#Credentials - never commit real ones, use MAIL_USERNAME / MAIL_PASSWORD instead
mock.mail.username = demo@example.com
mock.mail.password = demo-password
mail.username =
mail.password =

#Test data (classpath resource or absolute path)
excel_path = testdata/ExcelData.xlsx

#Textbox
logintextbox = //input[@id='identifierId']
passwordtextbox = //input[@name='Passwd']
mailbox = //input[@aria-label='To recipients']
subjectbox = //input[@name='subjectbox']
searchname = //input[@name='q']
file_input = //input[@type='file' and @name='Filedata']

#Buttons
btn_next = //div[@id='identifierNext']//button
btn_login = //div[@id='passwordNext']//button
btn_compose = //div[@gh='cm']
btn_search = //button[@aria-label='Search mail']
sendbtn = //div[@role='button' and starts-with(@data-tooltip,'Send')]

#Page markers used for assertions
inbox_link = //a[contains(@href,'#inbox')]
message_sent = //*[contains(text(),'Message sent')]
